# ZX Racer stages: a 5-row pyramid (1 + 2 + 3 + 4 + 5 = 15 stages).
# At the end of each stage the road forks: the left half of the road leads
# to the stage below-left in the next row, the right half to below-right.
# The last row ends at the goal.
#
# Attributes are Spectrum attribute bytes: bit 6 bright, bits 5-3 paper,
# bits 2-0 ink (0 black, 1 blue, 2 red, 3 magenta, 4 green, 5 cyan, 6 yellow, 7 white).

themes:
  coast:
    name: SUNNY COAST
    types: [palm, bush]
    horizon: {style: mountains, seed: 7}
    palette: {sky: 0b01101000, pano: 0b01101001, hud: 0b01101001, time: 0b01101010,
              grass_l: 0b01100000, grass_d: 0b00100000, kerb_l: 0b01111000, kerb_d: 0b01010000,
              road: 0b01000111}
  desert:
    name: DESERT HIGHWAY
    types: [cactus, rock]
    horizon: {style: mesas, seed: 3}
    palette: {sky: 0b01101000, pano: 0b01101010, hud: 0b01101010, time: 0b01101010,
              grass_l: 0b01110000, grass_d: 0b00110000, kerb_l: 0b01111000, kerb_d: 0b01010000,
              road: 0b01000111}
  alpine:
    name: ALPINE PASS
    types: [pine, rock]
    horizon: {style: peaks, seed: 11}
    palette: {sky: 0b01101000, pano: 0b01101001, hud: 0b01101001, time: 0b01101010,
              grass_l: 0b01111000, grass_d: 0b00111000, kerb_l: 0b01010000, kerb_d: 0b01001000,
              road: 0b01000111}
  country:
    name: GREEN VALLEY
    types: [tree, bush]
    horizon: {style: hills, seed: 21}
    palette: {sky: 0b01101000, pano: 0b01101100, hud: 0b01101001, time: 0b01101010,
              grass_l: 0b01100000, grass_d: 0b00100000, kerb_l: 0b01111000, kerb_d: 0b01010000,
              road: 0b01000111}
  sunset:
    name: SUNSET BOULEVARD
    types: [lamp, bush]
    horizon: {style: skyline, seed: 5}
    palette: {sky: 0b01011000, pano: 0b01011000, hud: 0b01011110, time: 0b01011111,
              grass_l: 0b01100000, grass_d: 0b00100000, kerb_l: 0b01111000, kerb_d: 0b01010000,
              road: 0b01000111}

# Rows of the pyramid, left to right. Each stage: theme and a track seed.
# Bends get sharper and more frequent row by row.
rows:
  - [{theme: coast, seed: 1}]
  - [{theme: country, seed: 2}, {theme: desert, seed: 3}]
  - [{theme: alpine, seed: 4}, {theme: coast, seed: 5}, {theme: desert, seed: 6}]
  - [{theme: country, seed: 7}, {theme: alpine, seed: 8}, {theme: sunset, seed: 9}, {theme: desert, seed: 10}]
  - [{theme: alpine, seed: 11}, {theme: country, seed: 12}, {theme: coast, seed: 13}, {theme: sunset, seed: 14}, {theme: desert, seed: 15}]
